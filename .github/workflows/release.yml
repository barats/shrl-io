name: Release

# Cuts a release from a vX.Y.Z tag: gates on the full CI matrix, publishes
# the Go binaries and the GitHub release via GoReleaser, then pushes the five
# container images to ghcr.io. workflow_dispatch re-cuts an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # Kept in sync with the CI workflow's jobs of the same names.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  release:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # GoReleaser needs the full history and tags for the changelog.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      # GoReleaser shells out to the Go toolchain, so it needs Go set up.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - id: meta
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both Dockerfiles build for the build machine's native arch and
      # cross-compile for arm64, so no QEMU is needed. Tags come from the
      # VERSION/MINOR variables in docker-bake.hcl, overridden here via
      # environment (bake's variable-override mechanism).
      - uses: docker/setup-buildx-action@v4

      - uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          push: true
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MINOR: ${{ steps.meta.outputs.minor }}
