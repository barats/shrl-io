services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: shrl
      POSTGRES_PASSWORD: shrl
      POSTGRES_DB: shrl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shrl -d shrl"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["api"]
    environment:
      SHRL_DATABASE_URL: postgres://shrl:shrl@postgres:5432/shrl
      SHRL_REDIS_ADDR: redis:6379
      SHRL_ADMIN_USERNAME: ${SHRL_ADMIN_USERNAME:-admin}
      SHRL_ADMIN_PASSWORD: ${SHRL_ADMIN_PASSWORD:-}
      SHRL_DEFAULT_HOSTNAME: ${SHRL_DEFAULT_HOSTNAME:-localhost}
      SHRL_RETENTION_DAYS: ${SHRL_RETENTION_DAYS:-365}
      SHRL_API_ADDR: :8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redirector:
    build: .
    command: ["redirector"]
    environment:
      SHRL_REDIS_ADDR: redis:6379
      SHRL_REDIRECTOR_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["worker"]
    environment:
      SHRL_DATABASE_URL: postgres://shrl:shrl@postgres:5432/shrl
      SHRL_REDIS_ADDR: redis:6379
      SHRL_RETENTION_DAYS: ${SHRL_RETENTION_DAYS:-365}
      SHRL_GEOLITE_LICENSE: ${SHRL_GEOLITE_LICENSE:-}
      SHRL_GEOLITE_DB_PATH: /data/GeoLite2-City.mmdb
    volumes:
      - geodata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      SHRL_API_URL: http://api:8080
      SHRL_DEFAULT_HOSTNAME: ${SHRL_DEFAULT_HOSTNAME:-localhost}
      SHRL_SESSION_SECRET: ${SHRL_SESSION_SECRET:-dev-session-secret}
      SHRL_COOKIE_SECURE: ${SHRL_COOKIE_SECURE:-false}
    ports:
      - "8082:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  geodata:
