<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint so dark-mode users never
			// see a light flash. Mirrors theme.svelte.ts; keep in sync.
			(function () {
				try {
					var t = localStorage.getItem('shrl:theme');
					var dark =
						t === 'dark' ||
						(t !== 'light' &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
